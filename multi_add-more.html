<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi Add More using Jquery</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/img/jquery.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Raleway", sans-serif;
        }
        section{
            width: 100%;
            height: 100vh;
            background-image:url(https://images.unsplash.com/photo-1722939218986-a12ce21ac482?q=80&w=1932&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
            background-position: center;
            background-size: cover;
        }
        .heading{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .heading h1{
            text-align: center;
            padding: 40px 0px;
            color: #fff;
            font-size: 35px;
            position: relative;
            font-weight: 700;
        }
        .heading h1::after{
            position: absolute;
            content: "";
            width: 100%;
            height: 2px;
            left: 0;
            bottom: 30px;
            background-color: #fff;
        }
        .container {
            width: 100%;
            height: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-direction: column;
            background-color: #00000085;
            width: 49%;
            height: auto;
            padding: 15px 0px;
            margin: 10px 5px;
        }
        .main h1{
            color: #fff;
            margin-bottom: 20px;
        }
        .all-inputs {
            width: 98%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .all-inputs .inputs {
            margin-bottom: 10px;
            display: flex;
            width: 86%;
        }
        .all-inputs input[type="text"],
        select {
            width: 230px;
            height: 30px;
            font-size: 16px;
            padding: 0px 10px;
            margin: 0px 10px;
        }
        .all-inputs input[type="date"]{
            height: 30px;
            margin: 0px 10px;
        }
        .add {
            font-size: 15px;
            padding: 5px 15px;
            background-color: transparent;
            border: 2px solid #fff;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
            transition: .2s ease;
            margin:0px 20px;
        }
        .add:hover{
            background-color: green;
            border: 2px solid green;
            color: white;
            transition: .2s ease;
        }
        .remove {
            font-size: 15px;
            padding: 7px;
            background-color: transparent;
            border: 2px solid #fff;
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
            transition: .2s ease;
        }
        .remove:hover{
            background-color: crimson;
            color: #fff;
            border: 2px solid crimson;
            transition: .2s ease;
        }
        .submit{
            font-size: 15px;
            padding: 5px 15px;
            background-color: transparent;
            border: 2px solid #fff;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
            transition: .2s ease;
            margin: 10px 0px;
        }
        .submit:hover{
            background-color: aqua;
            color: #000;
            border: 2px solid aqua;
        }
        .inputs label{
            color: #fff;
            font-weight: 600;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <section>
        <div class="heading">
            <h1>Multi Add - More</h1>
        </div>
        <div class="container">
            <div class="main">
                <h1>First Form</h1>
                <div class="all-inputs">
                    <div class="inputs" id="first-div">
                        <label for="">Name *</label>
                        <input class="required" type="text" placeholder="Enter your Name">
                        <button class="remove"><i class="ri-close-line"></i></button>
                    </div>
                    <div class="btns">
                        <button class="add">Add</button>
                    </div>
                </div>
                <button class="submit">Submit</button>
            </div>
            <div class="main">
                <h1>Second Form</h1>
                <div class="all-inputs">
                    <div class="inputs" id="first-div">
                        <label for="">Country</label>
                        <select name="" id="">
                            <option value="">Select</option>
                            <option value="America">America</option>
                            <option value="Germany">Germany</option>
                        </select>
                        <label for="">Date *</label>
                        <input class="required" type="date" />
                        <button class="remove"><i class="ri-close-line"></i></button>
                    </div>
                    <div class="btns">
                        <button class="add">Add</button>
                    </div>
                </div>
                <button class="submit">Submit</button>
            </div>
            <div class="main">
                <h1>Third Form</h1>
                <div class="all-inputs">
                    <div class="inputs" id="first-div">
                        <label for="">Country *</label>
                        <select class="required"  name="" id="">
                            <option value="">Select</option>
                            <option value="America">America</option>
                            <option value="Germany">Germany</option>
                        </select>
                        <label for="">Date *</label>
                        <input class="required"  type="date" />
                        <label for="">Name *</label>
                        <input class="required"  type="text" placeholder="Enter your Name">
                        <button class="remove"><i class="ri-close-line"></i></button>
                    </div>
                    <div class="btns">
                        <button class="add">Add</button>
                    </div>
                </div>
                <button class="submit">Submit</button>
            </div>
            <div class="main">
                <h1>Fourth Form</h1>
                <div class="all-inputs">
                    <div class="inputs" id="first-div">
                        <label for="">Country</label>
                        <select  name="" id="">
                            <option value="">Select</option>
                            <option value="America">America</option>
                            <option value="Germany">Germany</option>
                        </select>
                        <button class="remove"><i class="ri-close-line"></i></button>
                    </div>
                    <div class="btns">
                        <button class="add">Add</button>
                    </div>
                </div>
                <button class="submit">Submit</button>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(() => {
            $('.add').each(function(){
                $(this).click(function(){
                    let newInput = $(this).parent().siblings().html();
                    let newDiv = $('<div></div>').addClass('inputs').html(newInput);
                    $(this).parent().siblings().parent('.all-inputs').append(newDiv);
                });
            });
            $(".all-inputs").on("click", '.remove', function (){
                if (!$(this).closest('.inputs').is('#first-div')){
                    $(this).closest('.inputs').remove();
                }
                else{
                    SweetAlert("Multi Add - More","You cannot delete the first record","error");
                }
            });
            $('.submit').each(function(){
                $(this).click(function(){
                    if(!Validation(this)){
                        return;
                    }
                    let form =  $(this).siblings('h1').html();
                    SweetAlert(`Multi Add - More`,`The Data is Submitted using the ${form}`,`success`);
                })
            })
            function Validation(item){
                if ($(item).siblings().children().children('.required').val() == '') {
                    SweetAlert("Multi Add - More","Please Insert all the input fields","warning");
                return false;
                }
                return true;
            }
            function SweetAlert(title,message,icon){
                Swal.fire({
                        title:title, text:message, icon:icon
                });
            }
        });
    </script>
</body>
</html>
