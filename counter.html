<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Using Javascript</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        font-family:Verdana, Geneva, Tahoma, sans-serif;
    }
    .main{
        width: 100%;
        height: 50vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    button{
        font-size: 16px;
        padding: 7px 15px;
        border: 1.5px solid black;
        outline: none;
        margin: 0px 10px;
        cursor: pointer;
        background-color: #000;
        color: #fff;
        transition: .2s ease-in-out;
        border-radius:5 px;
    }
    button:hover{
        background-color: whitesmoke;
        color: #000;
        transition: .2s ease-in-out;
    }
    .number{
        font-size: 40px;
        padding: 7px 10px;
        margin: 20px 0px;
        font-weight: 600;
    }
</style>
<body>
    <div class="main">
        <div class="heading">
            <h1>Counter</h1>
        </div>
     <div class="value">
        <div class="number">0</div>
     </div>
      <div class="all-btns">
        <button class="button" id="minus">Decrease</button>
        <button class="button" id="reset">Reset</button>
        <button class="button" id="add">Increase</button>
      </div>
    </div>
    <script>
            let buttons = document.querySelectorAll('.button');
            let value = document.querySelector('.number')
            let count = 0;

            buttons.forEach(function (button) {
                button.addEventListener('click', function(event){
                    let currentbtn = event.currentTarget.id;
                    if(currentbtn === 'add'){
                        count++;  
                    }
                    if(currentbtn === 'minus'){
                        count--;
                    }
                    if(currentbtn === 'reset'){
                        count = 0;
                    }
                    if(count > 0){
                        value.style.color = 'green';
                    }
                    if(count < 0){
                        value.style.color = 'red'
                    }
                    if(count === 0){
                        value.style.color = 'black';
                    }
                    value.textContent = count;  
                })
            })
    </script>
</body>
</html>
