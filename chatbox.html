<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chatbox using Jquery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet" /> 
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
            user-select: none;
        }
        ::-webkit-scrollbar {
        width: 10px;
        }
        ::-webkit-scrollbar-track {
        box-shadow: inset 0 0 5px grey;
        }
        ::-webkit-scrollbar-thumb {
        background: #fa4590;
        }
        ::-webkit-scrollbar-thumb:hover {
        background: #0C0330;
        cursor: pointer;
        }
        .row {
            height: 100vh;
        }
        .img-container {
            background-image: url("/img/chatting.jpg");
            width: 100%;
            height: 100vh;
            background-size: cover;
            background-position: center;
        }
        .chat-box {
            height: 60vh;
            background-color: #fff;
            overflow-y: scroll;
        }
        .chat-box .message-upper {
            margin: 30px 10px;
        }
        .chat-box .message-upper > span {
            background-color: #F1D275;
            border-radius: 5px;
            width: auto;
            padding: 10px;
            font-weight: 600;
        }
        .chat-box .message-lower {
            margin: 30px 10px;
            text-align: end;
        }
        .chat-box .message-lower > span {
            background-color: #80E3F7;
            border-radius: 5px;
            width: auto;
            padding: 10px;
            font-weight: 600;
        }
        .form-control{
            border: 2px solid #fff;
        }
        .form-control:focus {
            border: 2px solid #FA1F79;
            box-shadow: 0px 0px 5px 1px #fff;
        }
    </style>
</head>
<body>
    <div class="img-container">
        <div class="overlay">
            <div class="container-fluid">
                <div class="row d-flex justify-content-center align-items-center">
                    <div class="main-box col-lg-4 col-md-9 col-11 border rounded p-3 d-flex flex-column justify-content-evenly align-items-center">
                        <div class="upper-input col-12 d-flex justify-content-evenly align-items-center my-3">
                            <div class="col-md-3 col-4 text-start">
                                <button class="btn btn-warning rounded-0 send-btn fw-bold" user-type="message-upper">
                                    Send <span><i class="ri-send-plane-fill"></i></span>
                                </button>
                            </div>
                            <div class="col-md-9 col-8">
                                <input placeholder="Sender" type="text" class="form-control rounded-0 upper-input" />
                            </div>
                        </div>
                        <div class="chat-box col-12"></div>
                        <div class="lower-input col-12 d-flex justify-content-evenly align-items-center my-3">
                            <div class="col-md-9 col-8 ">
                                <input placeholder="Reciever" type="text" class="form-control rounded-0 lower-input" />
                            </div>
                            <div class="col-md-3 col-4 text-end">
                                <button class="btn btn-info rounded-0 send-btn fw-bold" user-type="message-lower">Send <span><i
                                            class="ri-send-plane-fill"></i></span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        $(document).ready(function () {
            LoadFromLocalStorage();
            $(".send-btn").each(function () {
                $(this).click(function () {
                    if ($(this).parent().siblings().children().val() == "") {
                        Alert("Please Write Message For Sending", "warning");
                        return false;
                    }
                    let value = $(this).parent().siblings().children().val();
                    AddMessage(value,$(this).attr('user-type'),true);
                    $(this).parent().siblings().children().val("");
                });
            });
            function AddMessage(value,className,isSave = false){
                let message_div = $("<div></div>").addClass("message");
                let span = $("<span>").html(value);
                message_div.addClass(className);
                message_div.append(span);
                if(isSave){
                  SaveToLocalStorage(span,className);
                }
                $(".chat-box").append(message_div);
            }
            function Alert(message, icon) {
                Swal.fire({
                    text: message,
                    icon: icon,
                });
            }
            function SaveToLocalStorage(item,className) {
                let messages = JSON.parse(localStorage.getItem("All_messages")) || [];
                let obj = {msg: item.text()};
                obj.className = className;
                messages.push(obj);
                localStorage.setItem("All_messages", JSON.stringify(messages));
            }
            function LoadFromLocalStorage() {
                let get_messages = JSON.parse(localStorage.getItem("All_messages"));
                $(get_messages).each(function (key, value) {
                    AddMessage(value.msg,value.className);
                });
            }
        });
    </script>
</body>
</html>
