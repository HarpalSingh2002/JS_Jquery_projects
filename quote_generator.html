<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quotes Generator Using JavaScript</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }
        ::selection {
            background-color: #fff;
            color: #000;
        }
        .video-container {
            position: relative;
        }
        video {
            width: 100%;
            height: auto;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #main-quote h3 {
            font-weight: 500;
            line-height: 1.3em;
            letter-spacing: 1px;
            color: #fff;
            text-align: justify;
        }
        #quote-author h5 {
            letter-spacing: 1px;
            color: rgb(255, 145, 255);
        }
        .quote-btn button {
            background-color: thistle;
            border: 2px solid thistle;
            color: #000;
        }
        .quote-btn button:hover {
            border: 2px solid thistle;
            color: thistle;
            background-color: transparent;
        }
        @media only screen and (max-width: 600px) {
            #main-quote h3 {
                font-size: 17px;
            }
            #quote-author h5 {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video autoplay loop muted src="/video/quotes-video2.mp4"></video>
        <div class="overlay">
            <div class="col-lg-7 col-md-9 col-11 ">
                <div class="quotes-box">
                    <div id="main-quote">
                        <h3>“ It is during our darkest moments that we must focus to see the light. ”</h3>
                    </div>
                    <div id="quote-author" class=" text-end ">
                        <h5>- Aristotle</h5>
                    </div>
                    <div class="quote-btn text-center mt-md-5 mt-3">
                        <button id="generate-quote" class=" btn fw-bolder">New Quote</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let quotes = [
            { quote: '“ The greatest glory in living lies not in never falling, but in rising every time we fall. ”', author: "- Nelson Mandela" },
            { quote: '“ The way to get started is to quit talking and begin doing. ”', author: "- Walt Disney" },
            { quote: '“ The future belongs to those who believe in the beauty of their dreams. ”', author: "- Eleanor Roosevelt" },
            { quote: '“ The only thing we have to fear is fear itself. ”', author: "- Franklin D. Roosevelt" },
            { quote: '“ The best and most beautiful things in the world cannot be seen or even touched - they must be felt with the heart. ”', author: "- Helen Keller" },
            { quote: '“ Darkness cannot drive out darkness only light can do that. Hate cannot drive out hate: only love can do that. ”', author: "- Martin Luther King Jr" },
            { quote: "“ Spread love everywhere you go. Let no one ever come to you without leaving happier. ”", author: "– Mother Teresa" },
            { quote: "“ Do not go where the path may lead; go instead where there is no path and leave a trail. ”", author: "– Ralph Waldo Emerson" },
            { quote: "“ Go confidently in the direction of your dreams! Live the life you've imagined. ”", author: "– Henry David Thoreau" },
            { quote: "“ Do one thing every day that scares you. ”", author: "– Eleanor Roosevelt" },
            { quote: "“ Don't worry when you are not recognized but strive to be worthy of recognition. ”", author: "– Abraham Lincoln" },
            { quote: "“ You only live once, but if you do it right, once is enough. ”", author: "– Mae West" },
            { quote: "“ You may say I‘m a dreamer, but I’m not the only one. I hope someday you'll join us. And the world will live as one. ”", author: "– John Lennon" },
            { quote: "“ Keep smiling, because life is a beautiful thing and there's so much to smile about. ”", author: "– Marilyn Monroe" },
            { quote: "“ So we beat on, boats against the current, borne back ceaselessly into the past. ”", author: "– F. Scott Fitzgerald" },
            { quote: "“ Your time is limited, so don't waste it living someone else's life. Don't be trapped by dogma — which is living with the results of other people's thinking. ”", author: "– Steve Jobs" },
            { quote: "“ Life is trying things to see if they work. ”", author: "– Ray Bradbury" },
            { quote: "“ Many of life's failures are people who did not realize how close they were to success when they gave up. ”", author: "– Thomas A. Edison" },
            { quote: "“ Success usually comes to those who are too busy to be looking for it. ”", author: "– Henry David Thoreau" },
            { quote: "“ To be successful, you have to be selfish, or else you will never achieve. And once you get to your highest level, then you have to be unselfish. ”", author: "– Michael Jordan" }
        ]
        document.querySelector('#generate-quote').addEventListener('click', () => {
            let display_quote = Math.floor(Math.random() * quotes.length);
            document.querySelector('#main-quote h3').textContent = quotes[display_quote].quote;
            document.querySelector('#quote-author h5').textContent = quotes[display_quote].author;
        })
        setInterval(function () {
            let display_quote = Math.floor(Math.random() * quotes.length);
            document.querySelector('#main-quote h3').textContent = quotes[display_quote].quote;
            document.querySelector('#quote-author h5').textContent = quotes[display_quote].author;
        }, 5000)
    </script>
</body>
</html>
