<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator using javascript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    button{
        font-size: 20px;
        width: 70px;
        height: 50px;
        margin: 5px 0px;
    }
    .cal-btns{
        display: flex;
        flex-wrap: wrap;
        justify-content: space-evenly;
        align-items: center;
    }
    #equal{
        width: 140px;
    }
    .row{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .cal-body{
        background-color: #000;
        padding: 10px;
        border-radius: 5px;
    }
    #input-feild{
        border-radius: 0;
        background-color: white;
        width: auto;
        height: 7vh;
        text-align: end;
        font-size: 25px;
        padding-right: 10px;
    }
</style>
<body>
  <div class="container">
    <div class="row">
        <div class="col-md-4 col-10 main">
            <div class="cal-body">
                <div class="cal-input col-md-11 my-2 mx-auto">
                    <div id="input-feild"></div>
                </div>
                <div class="cal-btns col-12">
                    <button value="ac">AC</button>
                    <button value="del">Del</button>
                    <button value="%">%</button>
                    <button value="/">/</button>
                    <button value="7">7</button>
                    <button value="8">8</button>
                    <button value="9">9</button>
                    <button value="*">*</button>
                    <button value="4">4</button>
                    <button value="5">5</button>
                    <button value="6">6</button>
                    <button value="-">-</button>
                    <button value="1">1</button>
                    <button value="2">2</button>
                    <button value="3">3</button>
                    <button value="+">+</button>
                    <button value="0">0</button>
                    <button value=".">.</button>
                    <button value="=" id="equal">=</button>
                </div>
            </div>
        </div>
    </div>
  </div>
  <script>
    let inputField = document.querySelector('#input-feild');
    let buttons = document.querySelectorAll('button');
    let inputString = '';
    buttons.forEach(function(button){
        button.addEventListener('click', function(){
            let value = this.value;
            console.log(typeof value)
            if (value === 'ac') { 0
                inputString = '';
            }
            else if (value === 'del') {
                inputString = inputString.slice(0, -1);
            }
            else if (value === '=') {
                try {
                    inputString = eval(inputString);
                } catch {
                    inputString = 'Error';
                }
            }
            else {
                inputString += value;
            }
            inputField.innerHTML = inputString;
        })
    })
  </script>
</body>
</html>
